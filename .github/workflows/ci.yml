name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小权限：只读内容，不写入、不暴露密钥
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型检查 / Lint / 格式 / 单元测试 / 生产构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装锁定版本依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier 格式检查
        run: npm run format:check

      - name: 单元测试（公开示例题库）
        run: npm test

      - name: 生产构建（公开示例题库，不依赖私人题库）
        run: npm run build

  ai-proxy:
    name: AI 代理契约测试（模拟网关）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装锁定版本依赖
        run: npm ci

      - name: AI 代理契约测试
        run: npm run test:ai

  browser-e2e:
    name: 浏览器 E2E 关键流程
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装锁定版本依赖
        run: npm ci

      - name: 安装 Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: 启动开发服务器
        run: |
          npm run dev &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ > /dev/null; then echo "dev server ready"; exit 0; fi
            sleep 1
          done
          echo "dev server failed to start"; exit 1

      - name: 浏览器 E2E（公开示例题库）
        run: npm run test:browser
        env:
          E2E_BASE: http://localhost:5173
          CHROME_PATH: /usr/bin/google-chrome-stable

      - name: 失败时上传诊断日志
        if: failure()
        run: |
          echo "----- vite log -----"
          cat nohup.out 2>/dev/null || true
          echo "----- dev server probe -----"
          curl -sS -o /dev/null -w "%{http_code}\n" http://localhost:5173/ || true
